<header>
  <div class="greeting">
    <button class="menu-btn" mat-icon-button (click)="toggleDrawerClick()" aria-label="Open menu">
      <app-lucide-icon name="menu" [size]="19" />
    </button>
    <h2>Welcome, {{ username }}!</h2>
    <p>{{ dayName }}, {{ dateStr }}</p>
  </div>

  <div class="actions">
    <!-- GANTI YANG INI, DARI DROPDOWN JADI INFO DOANG -->
    <div class="user-info">
      <div class="user-text">
        <span class="user-name">{{ username }}</span>
        <span class="user-role">Administrator</span>
      </div>
      <img src="https://i.pravatar.cc/100" alt="avatar" class="avatar" />
    </div>
  </div>
</header>
